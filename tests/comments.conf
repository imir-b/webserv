# Configuration principale

server {
    listen 8080; # Port HTTP
    server_name localhost;

    # Répertoire principal
    root ./www;
    index index.html;

    client_max_body_size 10M;

    location / {
        root ./www;
        allowed_methods GET POST; # GET et POST uniquement
        autoindex off;
    }

    # Répertoire des uploads
    location /uploads {
        root ./uploads;
        allowed_methods GET POST DELETE;
        autoindex on;
    }
}