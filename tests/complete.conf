server {
    listen 8080;
    server_name localhost;
    root ./www;
    index index.html;
    client_max_body_size 10M;

    location / {
        root ./www;
        index index.html;
        allowed_methods GET POST;
        autoindex off;
    }

    location /uploads {
        root ./uploads;
        allowed_methods GET POST DELETE;
        autoindex on;
    }

    location /images {
        root ./www/images;
        index gallery.html;
        allowed_methods GET;
        autoindex on;
    }
}

