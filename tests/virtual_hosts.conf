server {
    listen 8080;
    server_name site1.local;
    root ./www/site1;
    index index.html;

    location / {
        allowed_methods GET;
    }
}

server {
    listen 8080;
    server_name site2.local;
    root ./www/site2;
    index index.html;

    location / {
        allowed_methods GET POST;
    }
}

server {
    listen 8081;
    server_name site3.local;
    root ./www/site3;
    index index.html;
}